name: PR Validation

on:
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r services/product-service/requirements.txt
          pip install -r services/cart-service/requirements.txt
          pip install -r services/frontend/requirements.txt
          pip install pytest

      - name: Run unit tests
        run: pytest services/ --tb=short -q

      - name: Build Docker images
        run: |
          docker build -t pratik0207/frontend:test ./services/frontend
          docker build -t pratik0207/product-service:test ./services/product-service
          docker build -t pratik0207/cart-service:test ./services/cart-service

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'pratik0207/product-service:test'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true
