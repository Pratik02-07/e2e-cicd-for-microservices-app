---
- name: Create application directory
  file:
    path: "/opt/{{ app_name }}"
    state: directory
    mode: '0755'

- name: Render docker-compose from template
  template:
    src: docker-compose.j2
    dest: "/opt/{{ app_name }}/docker-compose.yml"
    mode: '0644'

- name: Pull application images
  command: docker compose pull
  args:
    chdir: "/opt/{{ app_name }}"
  register: compose_pull
  changed_when: "'Pulled' in compose_pull.stdout or 'Downloaded' in compose_pull.stdout"

- name: Start application containers
  command: docker compose up -d --remove-orphans
  args:
    chdir: "/opt/{{ app_name }}"
  register: compose_up
  changed_when: "'Started' in compose_up.stdout or 'Created' in compose_up.stdout or 'Recreated' in compose_up.stdout"

- name: Wait for the frontend health endpoint
  uri:
    url: "http://127.0.0.1:{{ frontend_port }}/health"
    status_code: 200
  register: health_check
  until: health_check.status == 200
  retries: 30
  delay: 5

- name: Record deployed image tag
  copy:
    content: |
      deployed_tag={{ image_tag }}
      registry={{ registry }}
      env={{ env }}
    dest: "/opt/{{ app_name }}/deployed.tag"
    mode: '0644'
