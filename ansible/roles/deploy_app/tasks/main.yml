- name: Create application directory
  file:
    path: "/opt/{{ app_name }}"
    state: directory
    mode: '0755'

- name: Render docker-compose from template
  template:
    src: docker-compose.j2
    dest: "/opt/{{ app_name }}/docker-compose.yml"
    mode: '0644'

- name: Pull images and start containers
  command: docker compose up -d
  args:
    chdir: "/opt/{{ app_name }}"

- name: Wait for frontend to become healthy
  uri:
    url: "http://{{ inventory_hostname }}:{{ frontend_port }}/health"
    return_content: yes
    status_code: 200
  register: health_check
  until: health_check.status == 200
  retries: 30
  delay: 5

- name: Record deployed image tag
  copy:
    content: "deployed_tag={{ image_tag }}\nregistry={{ registry }}\nenv={{ env }}\n"
    dest: "/opt/{{ app_name }}/deployed.tag"
    mode: '0644'