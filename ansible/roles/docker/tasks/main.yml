- name: Install required system packages
  dnf:
    name:
      - yum-utils
    state: present

- name: Add Docker CE repository
  command: yum-config-manager --add-repo https://download.docker.com/linux/centos/9/x86_64/stable.repo
  creates: /etc/yum.repos.d/docker-ce.repo

- name: Install Docker Engine and Compose plugin
  dnf:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present
    update_cache: yes

- name: Start and enable Docker service
  service:
    name: docker
    state: started
    enabled: yes

- name: Add deploy user to docker group
  user:
    name: "{{ ansible_user }}"
    groups: docker
    append: yes